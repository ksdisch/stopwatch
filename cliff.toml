# cliff.toml — git-cliff config for Tempo's CHANGELOG automation.
#
# WHAT THIS IS:
#   git-cliff (https://git-cliff.org) renders a Keep-a-Changelog-style log from
#   the repo's Conventional Commits. It backs the dispatch-only
#   .github/workflows/release.yml job, which regenerates the log on demand and
#   uploads it as an artifact for review — it does NOT auto-commit or auto-release.
#
# RELATION TO THE HAND-MAINTAINED CHANGELOG.md:
#   CHANGELOG.md is the canonical, human-curated log, keyed to sw.js CACHE_NAME
#   build slugs (stopwatch-vNNN-slug) — Tempo's actual release anchor. See
#   docs/runbooks/deploy-and-cache-bump.md for the slug model. This config is an
#   *aid* for drafting the next section, not a replacement for the curated file.
#
# THE TAG PREREQUISITE (be honest about it):
#   git-cliff groups commits by git TAG. Tempo has ZERO git tags today, so a bare
#   `git cliff` run emits a single [unreleased] section spanning all history. To
#   get slug-keyed sections, cut one annotated tag per CACHE_NAME slug at deploy
#   time (e.g. `git tag v104-pomo-revert <sha>`) — the maintenance cadence in
#   docs/artifacts-plan.md recommends exactly this. `tag_pattern` below matches
#   both bare `vN` and full `stopwatch-vN` slug tags.

[changelog]
header = """
# Changelog (generated)

Rendered by [git-cliff](https://git-cliff.org) from Conventional Commits. The
canonical, human-curated log is [`CHANGELOG.md`](CHANGELOG.md), keyed to `sw.js`
`CACHE_NAME` build slugs; this generated file is a drafting aid (see
[`docs/runbooks/deploy-and-cache-bump.md`](docs/runbooks/deploy-and-cache-bump.md)).
"""
# Keep-a-Changelog body (faithful to the upstream git-cliff keepachangelog example).
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | split(pat="\n") | first | upper_first }} \
            (`{{ commit.id | truncate(length=7, end="") }}`)\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Drop docs/chore/test/ci/style/build from the public log (matches the curated
# CHANGELOG.md policy of showing product changes only).
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^refactor", group = "Changed" },
  { message = "^perf", group = "Changed" },
  { message = "^revert", group = "Reverted" },
  { message = "^docs", skip = true },
  { message = "^chore", skip = true },
  { message = "^test", skip = true },
  { message = "^ci", skip = true },
  { message = "^style", skip = true },
  { message = "^build", skip = true },
]
protect_breaking_commits = false
filter_commits = false
# Match both bare `vN`/`vN.N.N` tags and full `stopwatch-vN-slug` CACHE_NAME tags.
tag_pattern = "(stopwatch-)?v[0-9]+.*"
topo_order = false
sort_commits = "newest"
