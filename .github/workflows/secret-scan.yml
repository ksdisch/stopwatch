# .github/workflows/secret-scan.yml — repo-wide committed-secret gate.
#
# WHAT THIS IS:
#   Runs gitleaks on every pull_request AND every push, failing the check if a
#   committed secret (API key, token, private key, ...) is detected. Kept in a
#   SEPARATE workflow from ci.yml so ci.yml stays a PR-only correctness gate and
#   this scan can ALSO run on direct pushes to main — defense in depth against
#   the exact "straight-to-main bypasses the gate" failure mode ci.yml documents.
#
# REQUIRED-CHECK CONTRACT:
#   The job name below ("secret-scan") is the branch-protection status context.
#   Keep it stable — renaming the job silently drops the required check.
#
# CONFIG / FALSE POSITIVES:
#   Rules + the one allowlisted false positive (the public Firebase web config)
#   live in the repo-root .gitleaks.toml. See that file's header for the why.
#
# LICENSE NOTE:
#   gitleaks-action requires GITLEAKS_LICENSE only for GitHub *organizations*.
#   This repo is a personal account (ksdisch), so no license/secret is needed.

name: secret-scan

on:
  pull_request:
  push:

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks scans every commit, not just the tip.
          fetch-depth: 0

      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
