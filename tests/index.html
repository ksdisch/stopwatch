<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stopwatch Tests</title>
  <!-- E-1a: ensure ?nosw=1 is on the URL so all script-src requests below
       inherit it via the Referer header and bypass the SW cache. Silent
       guard — the address-bar URL change is the indicator. -->
  <script>
    (function () {
      var url = new URL(window.location.href);
      if (!url.searchParams.has('nosw')) {
        url.searchParams.set('nosw', '1');
        window.location.replace(url.toString());
      }
    })();
  </script>
  <style>
    body {
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      padding: 20px;
      font-size: 14px;
    }
    #results {
      white-space: pre-wrap;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <pre id="results">Running tests...</pre>

  <!-- Load engine modules (no DOM dependencies) -->
  <script src="../js/utils.js"></script>
  <!-- escapeHtml — used by rhythm-insights card chrome + panel renders. -->
  <script src="../js/dom-utils.js"></script>
  <script src="../js/schema.js"></script>
  <!-- R9: durable notification store (pure plan() + tempo_notify_db IDB CRUD).
       No deps — only indexedDB/self. sw.js loads the same bytes via
       importScripts; here it loads on the page so the engine suite can test it. -->
  <script src="../js/bg-notify-store.js"></script>
  <script src="../js/stopwatch.js"></script>
  <script src="../js/timer.js"></script>
  <script src="../js/button-fsm.js"></script>
  <script src="../js/instance-manager.js"></script>
  <script src="../js/pomodoro.js"></script>
  <script src="../js/interval.js"></script>
  <script src="../js/flow.js"></script>
  <script src="../js/meds.js"></script>
  <!-- E-1d-f3: BfrbEvents owns the consolidated bfrb_events store +
       migration. Load before analytics.js so analytics' BFRB-trend read
       path sees the consolidated stream during tests. -->
  <script src="../js/bfrb-events.js"></script>
  <!-- BFRB Closed Loop Slice B: pure pace-risk decision core (BfrbRisk). No
       load-order deps (events passed in); uses TempoCoach.readinessBand when
       present with a local fallback. -->
  <script src="../js/bfrb-risk.js"></script>
  <!-- Life-OS Phase 3: Mood owns the mood_events store (7th synced store,
       ADR-0008; no migration). Loaded with the other event-store data
       modules so the sync-engine adapter + merge tests see it. -->
  <script src="../js/mood.js"></script>
  <!-- Life-OS Phase 5: Finances owns the finances store (8th synced store,
       editable per-month LWW; no migration). Loaded with the other event-store
       data modules so the sync-engine adapter + merge tests see it. -->
  <script src="../js/finances.js"></script>
  <!-- E-1d-f8: Distractions owns the consolidated flow_distractions +
       pomodoro_distractions stores + migration. Load before any UI deps. -->
  <script src="../js/distractions.js"></script>
  <!-- Presets is loaded for F19b storage-layer tests (the only tests that
       exercise it; UI-coupled methods like applyPreset/captureCurrentConfig
       aren't tested here and won't run without their UI deps in scope). -->
  <script src="../js/presets.js"></script>
  <!-- Analytics depends on History.getSessions() + localStorage. Tests
       stub window.History per-case; no history.js load required here. -->
  <script src="../js/analytics.js"></script>
  <!-- Recovery feed: read-only consumer of mart_recovery_state from
       personal-health-elt. Stubs SyncFlag/SyncAuth/SyncFirestore per-case
       — no DOM deps. Loaded BEFORE rhythm-engine.js for consistency with
       the runtime load order. -->
  <script src="../js/recovery-feed.js"></script>
  <!-- Synthesis feed: read-only consumer of the council's per-node synthesis
       records (users/{uid}/synthesis/{nodeId}). Stubs
       SyncFlag/SyncAuth/SyncFirestore per-case — no DOM deps. Mirrors
       recovery-feed.js; loaded next to it for parity with runtime order. -->
  <script src="../js/synthesis-feed.js"></script>
  <!-- Home hub (Life-OS Phase 1): pure helpers (titleCase / lensValue /
       normalizeRadii / pillarCardModel / band mapping) on HomeUI._internals.
       render() is a DOM wrapper covered by Playwright, not this suite.
       Loaded after synthesis-feed.js (reads SynthesisFeed.PILLAR_NODES at
       module scope). -->
  <script src="../js/home-ui.js"></script>
  <!-- Physicals hub (Life-OS Phase 2): pure helpers (titleCase / bandForScore /
       bandLabel / bandColorVar / areaCardModel / areaModelsFrom / heroModel) on
       PhysicalsUI._internals. render() is a DOM wrapper covered by Playwright,
       not this suite. Loaded after synthesis-feed.js for parity with runtime. -->
  <script src="../js/physicals-ui.js"></script>
  <!-- Chickens hub (Life-OS Phase 3): pure helpers (titleCase / bandForScore /
       bandLabel / bandColorVar / areaCardModel / areaModelsFrom / heroModel) on
       ChickensUI._internals. render() is a DOM wrapper covered by Playwright,
       not this suite. Loaded after physicals-ui.js for parity with runtime. -->
  <script src="../js/chickens-ui.js"></script>
  <!-- Life Building hub (Life-OS Phase 5): pure helpers (titleCase /
       bandForScore / bandLabel / bandColorVar / areaCardModel / areaModelsFrom /
       heroModel / isEmptyState / formPrefillFrom / serializeForm) on
       LifeBuildingUI._internals. render() is a DOM wrapper covered by Playwright,
       not this suite. Loaded after chickens-ui.js for parity with runtime; also
       after finances.js (render path reads Finances.getMonth). -->
  <script src="../js/life-building-ui.js"></script>
  <!-- Rhythm engine: read-side daily timeline aggregator. Stubs
       window.History per-case + writes localStorage fixtures (mirrors
       analytics pattern). -->
  <script src="../js/rhythm-engine.js"></script>
  <!-- Rhythm Insights (#12): foundation engine + self-registering panels.
       build() reads via injected deps so tests pass plain data (no
       MedsManager/RecoveryUI seeding). The 6 parallel panels register their
       own production + test scripts during integration. -->
  <script src="../js/rhythm-insights.js"></script>
  <script src="../js/rhythm-panel-meds-sleep.js"></script>
  <script src="../js/rhythm-panel-recovery-trends.js"></script>
  <script src="../js/rhythm-panel-focus-minutes.js"></script>
  <script src="../js/rhythm-panel-bfrb-frequency.js"></script>
  <script src="../js/rhythm-panel-bfrb-triggers.js"></script>
  <script src="../js/rhythm-panel-distraction-rollup.js"></script>
  <script src="../js/rhythm-panel-event-zoom.js"></script>
  <script src="../js/rhythm-panel-correlations.js"></script>
  <!-- tempo-coach-daily-loop: pure coach engine (TempoCoach) must load BEFORE
       rhythm-panel-today.js (the panel calls TempoCoach.buildTodayModel). -->
  <script src="../js/tempo-coach.js"></script>
  <script src="../js/rhythm-panel-today.js"></script>
  <!-- Export / Import also stubs window.History per-case. -->
  <script src="../js/export.js"></script>
  <!-- Audio engine: ambient profile registration test. The IIFE does NOT
       instantiate AudioContext at load time (getCtx() is lazy + only fired
       by playback paths). getAmbientProfiles() is a pure map over a static
       array, so loading audio.js here is harmless even in headless contexts. -->
  <script src="../js/audio.js"></script>
  <!-- Sync flag + engine for B-1 SyncEngine tests. History / RecoveryUI are
       stubbed per-case (matches analytics.test / export.test pattern). The
       D-1 ManualDedupe helper is loaded alongside sync-engine so the
       D-1 tests can exercise it directly. -->
  <script src="../js/sync-flag.js"></script>
  <script src="../js/sync-firestore.js"></script>
  <script src="../js/sync-buffer.js"></script>
  <script src="../js/sync-engine.js"></script>
  <script src="../js/sync-toast.js"></script>
  <script src="../js/sync-manual-dedupe.js"></script>
  <script src="../js/sync-merge-equal.js"></script>
  <script src="../js/sync-merge-meds.js"></script>
  <script src="../js/sync-merge-history.js"></script>
  <script src="../js/sync-merge-rest-log.js"></script>
  <script src="../js/sync-merge-presets.js"></script>
  <script src="../js/sync-merge-bfrb.js"></script>
  <script src="../js/sync-merge-distractions.js"></script>
  <script src="../js/sync-merge-mood.js"></script>
  <script src="../js/sync-merge-finances.js"></script>
  <script src="../js/sync-auth.js"></script>
  <script src="../js/backup.js"></script>
  <!-- bl-2-todoist: Todoist REST v2 client + offline write queue.
       Pure data + network module (no DOM); tests mock window.fetch. -->
  <script src="../js/todoist.js"></script>

  <!-- Test framework -->
  <script src="test-runner.js"></script>

  <!-- Test suites -->
  <script src="utils.test.js"></script>
  <script src="dom-utils.test.js"></script>
  <script src="schema.test.js"></script>
  <script src="stopwatch.test.js"></script>
  <script src="timer.test.js"></script>
  <script src="instance-manager.test.js"></script>
  <script src="pomodoro.test.js"></script>
  <script src="interval.test.js"></script>
  <script src="flow.test.js"></script>
  <script src="meds.test.js"></script>
  <script src="sync-stamps.test.js"></script>
  <script src="sync-engine.test.js"></script>
  <script src="sync-auth.test.js"></script>
  <script src="sync-uploader.test.js"></script>
  <script src="sync-hydrate.test.js"></script>
  <script src="sync-imported-bucket.test.js"></script>
  <script src="sync-merge-equal.test.js"></script>
  <script src="sync-merge-meds.test.js"></script>
  <script src="sync-merge-history.test.js"></script>
  <script src="bfrb-events.test.js"></script>
  <script src="sync-merge-bfrb.test.js"></script>
  <script src="mood.test.js"></script>
  <script src="sync-merge-mood.test.js"></script>
  <script src="finances.test.js"></script>
  <script src="sync-merge-finances.test.js"></script>
  <script src="distractions.test.js"></script>
  <script src="sync-merge-distractions.test.js"></script>
  <script src="sync-merge-rest-log.test.js"></script>
  <script src="sync-merge-presets.test.js"></script>
  <script src="sync-buffer.test.js"></script>
  <script src="sync-listeners.test.js"></script>
  <script src="sync-toast.test.js"></script>
  <script src="presets.test.js"></script>
  <script src="analytics.test.js"></script>
  <script src="rhythm.test.js"></script>
  <script src="rhythm-insights.test.js"></script>
  <script src="rhythm-panel-meds-sleep.test.js"></script>
  <script src="rhythm-panel-recovery-trends.test.js"></script>
  <script src="rhythm-panel-focus-minutes.test.js"></script>
  <script src="rhythm-panel-bfrb-frequency.test.js"></script>
  <script src="bfrb-triggers.test.js"></script>
  <script src="bfrb-risk.test.js"></script>
  <script src="rhythm-panel-distraction-rollup.test.js"></script>
  <script src="rhythm-panel-event-zoom.test.js"></script>
  <script src="rhythm-panel-correlations.test.js"></script>
  <script src="tempo-coach.test.js"></script>
  <script src="rhythm-panel-today.test.js"></script>
  <script src="recovery-feed.test.js"></script>
  <script src="synthesis-feed.test.js"></script>
  <script src="home-ui.test.js"></script>
  <script src="physicals-ui.test.js"></script>
  <script src="chickens-ui.test.js"></script>
  <script src="life-building-ui.test.js"></script>
  <script src="export.test.js"></script>
  <script src="backup.test.js"></script>
  <script src="audio.test.js"></script>
  <script src="todoist.test.js"></script>
  <script src="button-fsm.test.js"></script>
  <script src="bg-notify-store.test.js"></script>

  <!-- Report -->
  <script>reportResults();</script>
</body>
</html>
